params:
  # Sibling plugin folder used to produce the first-pass draft translation.
  draft_model_dir: facebook_m2m100Model
  draft_model_name: facebook/m2m100_418M

  # Local Ollama instance used to polish the draft.
  ollama_url: http://localhost:11434
  # gemma4 is a "thinking" model: with reasoning ON it spends most of its output
  # budget on chain-of-thought (~5x slower) AND that reasoning overflows the
  # context on larger batches, which used to dump whole chunks back to the raw
  # draft. The detailed polish prompt + JSON schema don't need it, so disable it.
  # Set to null (or remove) if you switch ollama_model to a non-thinking model.
  ollama_think: false
  # Requested gemma3:12b-it-qat is not installed on this host; gemma4:12b-it-qat is the
  # available equivalent. Change this to gemma3:12b-it-qat once it is pulled into Ollama.
  ollama_model: gemma4:12b-it-qat
  ollama_timeout: 600
  temperature: 0.2
  # Unload the model right after polishing so ASR (whisperx) and TTS (chatterbox)
  # get the shared GPU back. 0 = unload now; use e.g. "5m" to keep it warm
  # between jobs if you have VRAM headroom.
  ollama_keep_alive: 0

  # A 12B model can't reliably emit one huge JSON array, so segments are polished
  # in chunks of `batch_size`, passing the last `context_size` finalized lines as
  # read-only context to keep pronouns/references consistent across chunks.
  batch_size: 20
  context_size: 4
  # Chunks are ALSO capped by combined original+draft characters, because long
  # paragraph-style segments (not just many segments) overflow the context window
  # and make the model return an empty response — which used to dump the whole
  # batch back to the raw draft. 0 = auto (num_ctx // 3). Any chunk that still
  # comes back empty is automatically split in half and retried, so segments only
  # fall back to the draft as a last resort, one at a time.
  max_chunk_chars: 0
  # Context window / max output tokens. gemma default is only 4096, which
  # truncates larger batches; 8192 comfortably covers batch_size=20.
  num_ctx: 8192
  num_predict: 8192
  # false = if the LLM drops a segment, keep its M2M draft (pipeline stays up).
  # true  = fail the job on any dropped segment instead of falling back.
  strict_polish: false

  log_level: INFO

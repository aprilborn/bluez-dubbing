# ========================================================== YAML silero TTS configuration file ==================================
# Silero is a fixed-speaker (non-cloning) model. Each language ships its own set
# of built-in voices; diarized speaker_ids are mapped deterministically onto them
# unless a specific speaker is forced (via the UI / request extra "forced_speaker").
#
# NOTE: the `silero-tts` wrapper depends on the `number2text` package, which only
# supports languages that have a matching number-to-words module. Silero ships
# models for more languages (ua, tt, ba, xal, ...), but they raise
# "Unsupported language" at load time, so only the working set is exposed here.

languages:
  - ru  # Russian
  - en  # English
  - de  # German
  - es  # Spanish
  - fr  # French
  - uz  # Uzbek


params:
  general:
    device: auto        # auto | cuda | cpu
    sample_rate: 48000  # clamped down to the model's supported rate when unavailable
    put_accent: true
    put_yo: true
    num_threads: 6

  # Per-language model pin (keyed by the pipeline's language code).
  # When a language is omitted, the latest silero model for it is used.
  models:
    ru: v4_ru
    en: v3_en
    de: v3_de
    es: v3_es
    fr: v3_fr
    uz: v4_uz

  # Per-language default speaker, used when a segment has no speaker_id and no
  # speaker is forced. When omitted, the model's first speaker is used.
  speakers:
    ru: baya
    en: en_0

  # Selectable voices per language (surfaced in the UI speaker dropdown). These
  # are the built-in speakers of each pinned model above; 'random' picks a random
  # voice on every call.
  speaker_catalog:
    ru: [aidar, baya, kseniya, xenia, eugene, random]
    en: [en_0, en_1, en_2, en_3, en_4, en_5, en_6, en_7, en_8, en_9, en_10, en_11, en_12, en_13, en_14, en_15, en_16, en_17, en_18, en_19, en_20, en_21, en_22, en_23, en_24, en_25, en_26, en_27, en_28, en_29, en_30, en_31, en_32, en_33, en_34, en_35, en_36, en_37, en_38, en_39, en_40, en_41, en_42, en_43, en_44, en_45, en_46, en_47, en_48, en_49, en_50, en_51, en_52, en_53, en_54, en_55, en_56, en_57, en_58, en_59, en_60, en_61, en_62, en_63, en_64, en_65, en_66, en_67, en_68, en_69, en_70, en_71, en_72, en_73, en_74, en_75, en_76, en_77, en_78, en_79, en_80, en_81, en_82, en_83, en_84, en_85, en_86, en_87, en_88, en_89, en_90, en_91, en_92, en_93, en_94, en_95, en_96, en_97, en_98, en_99, en_100, en_101, en_102, en_103, en_104, en_105, en_106, en_107, en_108, en_109, en_110, en_111, en_112, en_113, en_114, en_115, en_116, en_117, random]
    de: [bernd_ungerer, eva_k, friedrich, hokuspokus, karlsson, random]
    es: [es_0, es_1, es_2, random]
    fr: [fr_0, fr_1, fr_2, fr_3, fr_4, fr_5, random]
    uz: [dilnavoz]

  log_level: INFO
